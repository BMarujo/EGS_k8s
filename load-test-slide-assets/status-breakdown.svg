<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">HTTP status breakdown from recommended load test</title>
  <desc id="desc">Stacked bar showing 47.2 percent successful requests, 52.8 percent rate limited requests, and zero overload errors.</desc>
  <rect width="1100" height="420" fill="#0b0b0a"/>
  <text x="48" y="58" fill="#fff7e8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Recommended Demo Load Result</text>
  <text x="48" y="90" fill="#cbbfa9" font-family="Arial, sans-serif" font-size="17">30s run, 496 requests, no 5xx errors</text>

  <rect x="48" y="140" width="1000" height="74" rx="8" fill="#1f2937"/>
  <rect x="48" y="140" width="472" height="74" rx="8" fill="#2dd4bf"/>
  <rect x="520" y="140" width="528" height="74" rx="8" fill="#fbbf24"/>

  <line x1="520" y1="134" x2="520" y2="220" stroke="#0b0b0a" stroke-width="4"/>

  <text x="250" y="184" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">47.2%</text>
  <text x="785" y="184" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">52.8%</text>

  <text x="48" y="255" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="22" font-weight="700">234</text>
  <text x="48" y="282" fill="#fff7e8" font-family="Arial, sans-serif" font-size="16">200 OK</text>
  <text x="48" y="306" fill="#cbbfa9" font-family="Arial, sans-serif" font-size="15">Successful requests</text>

  <text x="300" y="255" fill="#fbbf24" font-family="Arial, sans-serif" font-size="22" font-weight="700">262</text>
  <text x="300" y="282" fill="#fff7e8" font-family="Arial, sans-serif" font-size="16">429 rate limited</text>
  <text x="300" y="306" fill="#cbbfa9" font-family="Arial, sans-serif" font-size="15">Protection activated</text>

  <text x="610" y="255" fill="#34d399" font-family="Arial, sans-serif" font-size="22" font-weight="700">0</text>
  <text x="610" y="282" fill="#fff7e8" font-family="Arial, sans-serif" font-size="16">5xx errors</text>
  <text x="610" y="306" fill="#cbbfa9" font-family="Arial, sans-serif" font-size="15">No overload failures in this profile</text>

  <text x="48" y="365" fill="#cbbfa9" font-family="Arial, sans-serif" font-size="16">Interpretation: this profile is strong enough to trigger rate limits, but controlled enough to avoid service failures.</text>
</svg>
